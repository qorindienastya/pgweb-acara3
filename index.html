<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Color</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #color_area {
            height: 400px;
            background-color: #fff3f3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row mb-4">
            <div class="col" id="color_area"></div>
        </div>
        <div class="row mt-4 text-center">
            <div class="col d-grid">
                <button type="button" class="btn btn-danger" onclick="ubahwarna('red')">RED</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-warning" onclick="ubahwarna('yellow')">YELLOW</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-success" onclick="ubahwarna('green')">GREEN</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-primary" onclick="ubahwarna('blue')">BLUE</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn" style="background-color: rgb(255, 196, 231);"
                    onclick="ubahwarna('pink')">PINK</button>
            </div>
            <div class="alret alret-light text-center mt-5" style="background-color: #fff3f3; padding: 8px;" role="alert">
                Qorin Dienastya | 25/560382/SV/26432 | PGWEB A | ACARA 3
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        // Function untuk mengubah warna menjadi merah

        function ubahwarna(warna) {
            document.getElementById("color_area").style.backgroundColor = warna;
        }


    </script>
</body>

</html>
